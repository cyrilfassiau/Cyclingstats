[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 demande Node 20.19+ ou 22.12+
  NODE_VERSION = "22"

# Application monopage : toute adresse inconnue (/stages, /rides/…) renvoie index.html, que
# React Router prend en charge. Les fichiers qui existent (assets, mockServiceWorker.js,
# demo/rides.json) restent servis tels quels : cette règle ne s'applique qu'à ce qui manque.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
